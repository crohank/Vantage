name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Settings validates this at import, so every job that touches the
  # package needs one. The placeholder is only ever used by jobs that
  # make no SEC request; the corpus download below requires the secret.
  SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT || 'Vantage CI vantage-ci@crohank.dev' }}

defaults:
  run:
    working-directory: backend

jobs:
  # Everything here is deterministic and offline. No LLM calls, no provider
  # quota, so it can run on every push without a bill or a rate limit.
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check vantage tests

      - name: Format
        run: uv run ruff format --check vantage tests

      - name: Types
        run: uv run mypy vantage

      - name: No em or en dashes in source
        # Project rule: the app's font stack has no glyph for them, so they
        # render as a tofu box wherever this text reaches a user.
        # Python rather than grep: not every grep build accepts a unicode
        # escape above U+00FF, and a grep that errors exits non-zero, which
        # an "if" reads as no-match and passes the step silently.
        run: uv run python ../scripts/check_dashes.py vantage tests

      - name: Unit tests
        # Network and LLM-judge suites are excluded by the marker config in
        # pyproject, so this stays hermetic.
        run: uv run pytest tests -q

  # The quality gate proper. Scores the diff engine against synthetically
  # mutated real filings and fails when detection or citation validity
  # regresses past the committed thresholds.
  diff-gate:
    name: diff engine gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --frozen

      # Filings are about 1.5 MB each and would bloat the repository, so the
      # corpus is cached rather than committed. The key is stable so the
      # cache is reused until deliberately rotated.
      - name: Restore filing corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: backend/vantage/eval/corpus
          key: edgar-corpus-v1

      - name: Download corpus on cache miss
        if: steps.corpus.outputs.cache-hit != 'true'
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MONGODB_URI: mongodb://unused/vantage
        run: |
          # SEC fair access requires a reachable contact address, so refuse
          # to download rather than falling back to the placeholder.
          if [ -z "$SEC_EDGAR_USER_AGENT" ]; then
            echo "The corpus cache missed and SEC_EDGAR_USER_AGENT is not set."
            echo "Add it as a repository secret: '<name> <your email>'."
            exit 1
          fi
          uv run python -m vantage.eval.run_diff_eval --refresh

      - name: Run gate
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MONGODB_URI: mongodb://unused/vantage
        run: uv run python -m vantage.eval.run_diff_eval | tee gate.txt

      - name: Publish scores to the run summary
        if: always()
        run: |
          {
            echo '### Diff engine gate'
            echo '```'
            cat gate.txt || echo 'gate did not produce output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The frontend's types are generated from the backend's OpenAPI schema, so
  # this job also proves the two have not drifted: it regenerates them and
  # fails if the committed output differs.
  web:
    name: frontend types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend
        working-directory: backend
        run: uv sync --frozen

      - name: Export the OpenAPI schema
        working-directory: backend
        run: |
          uv run python -c "
          import json, pathlib
          from vantage.api.app import app
          pathlib.Path('../frontend/src/api/openapi.json').write_text(
              json.dumps(app.openapi(), indent=2), encoding='utf-8')
          "

      - name: Install frontend
        run: npm ci

      - name: Regenerate types
        run: npm run gen:api

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --quiet -- src/api; then
            echo "The API schema changed but the generated client was not committed."
            echo "Run: cd frontend && npm run gen:api"
            git --no-pager diff --stat -- src/api
            exit 1
          fi

      - name: Typecheck and build
        run: npm run build
