# NOTE: the live vantage-backend service was created from the dashboard, not
# from this file, so Render does not read it. Editing this changes nothing
# until the service is recreated through the Blueprint flow. Keep the two in
# step by hand, or recreate from here so this file is the source of truth.
services:
  - type: web
    name: vantage-api
    runtime: python
    plan: free
    # uv is not preinstalled on Render's Python runtime, and the lockfile is
    # the point of using it, so install it and sync from the lock rather than
    # resolving fresh at build time.
    buildCommand: |
      pip install uv
      cd backend && uv sync --frozen --no-dev
    # One worker. The free tier caps at 512 MB and the job runner already
    # bounds concurrency in-process via VANTAGE_MAX_CONCURRENT_JOBS.
    startCommand: cd backend && uv run uvicorn vantage.api.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VANTAGE_CACHE_PATH
        value: /opt/render/project/src/.cache
      # Render exposes the deployed commit, which the findings carry as
      # provenance so a result can be traced back to the code that made it.
      - key: VANTAGE_GIT_SHA
        fromService:
          type: web
          name: vantage-api
          property: commitId
      # Set in the dashboard:
      #   SEC_EDGAR_USER_AGENT  required, must be a real contact address
      #   VANTAGE_API_KEY       required in production, there is no auth without it
      #   VANTAGE_CORS_ORIGINS  the Vercel URL, added after the frontend deploys
      #   MONGODB_URI           optional, enables durable checkpointing
      #   GEMINI_API_KEY        optional, only the explain step uses it
      #   Attention keys        all optional, sources degrade independently
